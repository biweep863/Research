tldr: "Earth intercepts ~174,000 TW of sunlight and a desert-and-rooftop footprint alone beats world electricity demand 81x; the real limit is the biosphere, and scheduling harvest around each ecosystem's daily light budget recovers up to 45% more energy at zero ecological cost."
