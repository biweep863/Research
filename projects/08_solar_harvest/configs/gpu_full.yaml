project: solar_harvest
seed: 0

# Wider, finer sweep. Still CPU-only (no model, no GPU needed) -- the name
# mirrors the other projects' scale-up config. Runs in seconds to a minute.
resource:
  lat_bands: [2.5, 7.5, 12.5, 17.5, 22.5, 27.5, 32.5, 37.5, 42.5, 47.5,
              52.5, 57.5, 62.5, 67.5, 72.5, 77.5, 82.5, 87.5]   # 5-deg bands
  doy_samples: 365

optimize:
  cells_lat: [5, 15, 25, 35, 45, 55, 65, 75]
  representative_doy: 80
  n_hours: 48                     # half-hour resolution
  f_min_grid: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7]
  f_min_headline: 0.3

output_dir: results
