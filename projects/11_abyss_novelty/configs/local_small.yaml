project: abyss_novelty
seed: 0

# --------------------------------------------------------------------------- #
# Stage 1: physical sensing budget (closed forms, src/physics)
# --------------------------------------------------------------------------- #
budget:
  depths_m: [1, 10, 50, 100, 200, 500, 1000, 2000, 4000, 6000, 8000, 11000]
  light:
    jerlov: {I: 0.022, IB: 0.030, II: 0.050, III: 0.10}   # Kd (1/m), 490 nm
    surface_irradiance_w_m2: 100.0
    detector_floor_w_m2: 1.0e-9           # ~ starlight-class detector
    two_way: true                          # satellite / lidar see reflected light
    biolum_photons: 1.0e+10                 # one flash
    camera_threshold_photons: 100.0
    camera_aperture_m2: 0.001
    biolum_kd: 0.05                        # 1/m at 480 nm, deep clear water
  radio:
    sigma_s_m: 4.0
    freqs_hz: [3, 30, 100, 1000, 10000, 100000, 1000000, 1.0e+8, 1.0e+9, 1.0e+10]
    detect_db: 60.0                        # link margin, dB
  acoustics:
    freqs_hz: [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000]
    sources:                               # source level dB re 1 uPa @ 1 m
      baleen_call: {sl: 180.0, f_hz: 50}
      odontocete_click: {sl: 210.0, f_hz: 20000}
      fish_chorus: {sl: 130.0, f_hz: 300}
      invertebrate_snap: {sl: 150.0, f_hz: 5000}
      soft_body_quiet: {sl: 100.0, f_hz: 1000}
    sea_states: [0, 3, 6]
    shipping: 0.5                          # 0 quiet .. 1 heavy
    directivity_db: 0.0
    detection_threshold_db: 10.0
    max_range_km: 5000.0
    spreading: hybrid                      # spherical to `transition_m`, cylindrical beyond
    transition_m: 4000.0
  edna:
    decay_per_h: [0.02, 0.05, 0.1]
    current_m_s: 0.05
    diffusivity_m2_s: 1.0
    shed_copies_per_h: 1.0e+8               # a large fish / cephalopod
    detect_copies_per_l: 0.01              # qPCR/ddPCR after filtering litres
    hours: [1, 3, 6, 12, 24, 48, 96]

# --------------------------------------------------------------------------- #
# Stage 2: bioacoustic simulation (src/sim) and features (src/novelty/features)
# --------------------------------------------------------------------------- #
audio:
  fs_hz: 16000
  clip_s: 2.0
  n_mels: 64
  n_frames: 96
  n_fft: 512
  fmin_hz: 50.0
  fmax_hz: 7500.0

sim:
  n_known: 12
  n_unknown: 5
  clips_per_species: 40
  families: ["tonal", "click", "drum", "burst"]
  range_km: [1.0, 100.0]          # random receiver range (log-uniform)
  sea_state: 3
  shipping: 0.5
  sl_db: [150.0, 185.0]           # per-species source level range

# --------------------------------------------------------------------------- #
# Stage 3: open-set novelty (src/novelty)
# --------------------------------------------------------------------------- #
novelty:
  test_frac: 0.35
  cnn: {embed: 64, epochs: 12, lr: 3.0e-3, batch: 32}
  ae: {latent: 32, epochs: 10, lr: 2.0e-3, batch: 32}
  pca_dim: 40
  knn_k: 5
  scores: ["msp", "energy", "knn", "maha", "ae", "pca_msp"]
  sweeps:
    range_km_max: [10.0, 100.0, 300.0]
    n_known: [4, 8]
    clips_per_species: [15, 40]
  n_boot: 300

real:
  dataset: beans_watkins
  n_unknown: 6
  holdout_draws: 3
  cnn: {embed: 64, epochs: 50, lr: 3.0e-3, batch: 16}
  min_clips_per_species: 8
  cache_max_per_species: 60

cluster:
  score: knn
  flag_quantile: 0.95            # known-score quantile above which a clip is "novel"
  k_range: [2, 10]
  link: average

# --------------------------------------------------------------------------- #
# Stage 4: how many remain, where to look (src/survey)
# --------------------------------------------------------------------------- #
survey:
  n_species: 300
  logseries_alpha: 40.0
  effort_hours: [1, 3, 10, 30, 100, 300, 1000, 3000]
  detect_rate_per_hour: 0.02     # per-individual-unit detection rate (range-scaled)
  n_rep: 30
  n_rep_alloc: 40
  habitats:
    seamount:  {richness: 300, area_frac: 0.15}
    plain:     {richness: 60, area_frac: 0.85}
  prior_quality: [0.5, 0.7, 0.9, 1.0]   # P(satellite prior points to the right habitat)
  budget_hours: 300
  n_sites: 20

output_dir: results
