project: abyss_novelty
seed: 0
device: cuda
deterministic: true

# Scaled configuration. More species, clips, sweeps and replicates; a finer
# depth/frequency grid; and, for the real-data study, the full BEANS-Watkins
# set (four of the five shards -- train_low is excluded, see doc/01_dataset.md)
# with the CNN trained much longer. The pretrained-audio-embedding step
# (src/novelty/backbone.py, AST) is gated by `real.backbone` below.
budget:
  depths_m: [1, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 3000, 4000, 6000, 8000, 10000, 11000]
  light:
    jerlov: {I: 0.022, IA: 0.026, IB: 0.030, II: 0.050, III: 0.10, C1: 0.15, C3: 0.30}
    surface_irradiance_w_m2: 100.0
    detector_floor_w_m2: 1.0e-9
    two_way: true
    biolum_photons: 1.0e+10
    camera_threshold_photons: 100.0
    camera_aperture_m2: 0.001
    biolum_kd: 0.05
  radio:
    sigma_s_m: 4.0
    freqs_hz: [1, 3, 10, 30, 100, 300, 1000, 10000, 100000, 1000000, 1.0e+7, 1.0e+8, 1.0e+9, 1.0e+10, 3.0e+10]
    detect_db: 60.0
  acoustics:
    freqs_hz: [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000]
    sources:
      baleen_call: {sl: 180.0, f_hz: 50}
      blue_whale_b_call: {sl: 188.0, f_hz: 16}
      odontocete_click: {sl: 210.0, f_hz: 20000}
      beaked_whale_click: {sl: 200.0, f_hz: 40000}
      fish_chorus: {sl: 130.0, f_hz: 300}
      invertebrate_snap: {sl: 150.0, f_hz: 5000}
      soft_body_quiet: {sl: 100.0, f_hz: 1000}
    sea_states: [0, 1, 3, 6]
    shipping: 0.5
    directivity_db: 0.0
    detection_threshold_db: 10.0
    max_range_km: 5000.0
    spreading: hybrid
    transition_m: 4000.0
  edna:
    decay_per_h: [0.01, 0.02, 0.05, 0.1, 0.2]
    current_m_s: 0.05
    diffusivity_m2_s: 1.0
    shed_copies_per_h: 1.0e+8
    detect_copies_per_l: 0.01
    hours: [1, 3, 6, 12, 24, 48, 96, 192]

audio:
  fs_hz: 32000
  clip_s: 3.0
  n_mels: 96
  n_frames: 128
  n_fft: 1024
  fmin_hz: 20.0
  fmax_hz: 15000.0

sim:
  n_known: 40
  n_unknown: 15
  clips_per_species: 200
  families: ["tonal", "click", "drum", "burst"]
  range_km: [1.0, 100.0]
  sea_state: 3
  shipping: 0.5
  sl_db: [150.0, 185.0]

novelty:
  test_frac: 0.35
  cnn: {embed: 128, epochs: 60, lr: 2.0e-3, batch: 64}
  ae: {latent: 64, epochs: 40, lr: 2.0e-3, batch: 64}
  pca_dim: 80
  knn_k: 10
  scores: ["msp", "energy", "knn", "maha", "ae", "pca_msp"]
  sweeps:
    range_km_max: [3.0, 10.0, 30.0, 100.0, 300.0, 1000.0]
    n_known: [4, 8, 12, 20, 40]
    clips_per_species: [10, 15, 20, 50, 100, 200]
  n_boot: 1000

real:
  dataset: beans_watkins
  n_unknown: 8
  holdout_draws: 10
  cnn: {embed: 128, epochs: 300, lr: 2.0e-3, batch: 32}
  min_clips_per_species: 8
  cache_max_per_species: 400
  cache: watkins_mel_full_32k_96x128.npz
  backbone: MIT/ast-finetuned-audioset-10-10-0.4593
  backbone_fs_hz: 16000
  backbone_max_s: 10.0
  backbone_batch: 16
  probe: {pca_dim: 128, C: 1.0}

cluster:
  score: knn
  flag_quantile: 0.95
  k_range: [2, 20]
  link: average

survey:
  n_species: 1000
  logseries_alpha: 60.0
  effort_hours: [1, 3, 10, 30, 100, 300, 1000, 3000, 10000, 30000]
  detect_rate_per_hour: 0.02
  n_rep: 200
  n_rep_alloc: 400
  habitats:
    seamount:  {richness: 600, area_frac: 0.10}
    canyon:    {richness: 400, area_frac: 0.15}
    plain:     {richness: 120, area_frac: 0.75}
  prior_quality: [0.34, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 1.0]
  budget_hours: 2000
  n_sites: 60

output_dir: results
