project: ray_budget
seed: 0

# Camera / image resolution used for rendered-quality experiments.
# Kept small so `make all` finishes in a couple of minutes on a laptop CPU.
render:
  width: 64
  height: 48
  reference_spp: 24        # high-sample ground-truth image
  scene_blades: 200        # grass blades in the rendered scene
  spheres: 3

# Acceleration scaling: cost (intersection tests) vs scene size.
accel:
  blade_counts: [50, 100, 200, 400, 800, 1600]
  bvh_leaf_size: 4

# Level-of-detail sweep: distant blades drop to a cheaper form.
lod:
  thresholds: [1.0, 0.6, 0.3, 0.0]   # fraction of depth range kept at full detail
  modes: ["simplified", "billboard"]
  spp: 10

# Sample-budget sweep: Monte-Carlo error and denoising vs samples per pixel.
sampling:
  spp_grid: [1, 2, 4, 8, 16]
  denoise_sigma_spatial: 1.5
  denoise_sigma_color: 0.12

output_dir: results
