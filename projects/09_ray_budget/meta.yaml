tldr: "A from-scratch path tracer measures four ways to cut ray-tracing cost against an exact reference: a BVH and geometry instancing (the Zelda grass trick) shift the cost-quality frontier for free with 100x+ fewer intersection tests at identical images, while level-of-detail and sample budgeting buy further speedups at a measurable, quantified quality price."
